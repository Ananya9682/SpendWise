<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in – SpendWise</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#071B3A">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <header class="site-header">
        <a class="brand" href="index.html">SpendWise</a>
        <nav aria-label="Main">
            <a class="btn btn-ghost" href="signup.html">Sign up</a>
        </nav>
    </header>

    <main id="main" class="auth-wrap">
        <div class="card">
            <h1>Log in</h1>
            <form id="login-form">
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <button class="btn btn-primary" id="submit-btn" type="submit">Log in</button>
                <p id="message" class="message" role="status"></p>
            </form>
            <p class="auth-switch">New to SpendWise? <a href="signup.html">Create an account</a></p>
        </div>
    </main>

    <script type="module" src="js/login.js"></script>
    <script type="module" src="js/pwa.js"></script>
</body>
</html>
