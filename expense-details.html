
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense details – SpendWise</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#071B3A">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <header class="site-header">
        <a class="brand" href="index.html">SpendWise</a>

        <nav aria-label="Account">
            <span id="user-email" class="user-email"></span>
            <button id="logout-btn" class="btn btn-ghost" type="button">
                Log out
            </button>
        </nav>
    </header>

    <main id="main" class="container">
        <p class="detail-actions">
            <a class="btn btn-secondary" href="expenses.html">
                Back to expenses
            </a>
        </p>

        <p id="loading" class="empty" role="status">
            Loading expense…
        </p>

        <p id="problem" class="empty" role="status" hidden></p>

        <article
            id="details"
            class="card detail-card"
            aria-labelledby="detail-title"
            hidden
        >
            <h1 id="detail-title"></h1>
            <p id="detail-amount" class="detail-amount"></p>

            <dl class="detail-list">
                <div>
                    <dt>Category</dt>
                    <dd>
                        <span id="detail-category" class="chip"></span>
                    </dd>
                </div>

                <div>
                    <dt>Date</dt>
                    <dd id="detail-date"></dd>
                </div>

                <div>
                    <dt>Notes</dt>
                    <dd>
                        <p id="detail-notes" class="detail-notes"></p>

                        <button
                            id="edit-notes-btn"
                            class="btn btn-secondary btn-small"
                            type="button"
                        >
                            Edit notes
                        </button>

                        <form id="notes-form" class="notes-editor" hidden>
                            <label for="notes-input">
                                What was this purchase for?
                            </label>

                            <textarea
                                id="notes-input"
                                rows="5"
                                maxlength="2000"
                                placeholder="Add details about this expense..."
                            ></textarea>

                            <p
                                id="notes-message"
                                class="notes-message"
                                role="status"
                                hidden
                            ></p>

                            <div class="notes-editor-actions">
                                <button
                                    id="save-notes-btn"
                                    class="btn"
                                    type="submit"
                                >
                                    Save notes
                                </button>

                                <button
                                    id="cancel-notes-btn"
                                    class="btn btn-secondary"
                                    type="button"
                                >
                                    Cancel
                                </button>
                            </div>
                        </form>
                    </dd>
                </div>
            </dl>
        </article>
    </main>

    <script type="module" src="js/expense-details.js"></script>
    <script type="module" src="js/pwa.js"></script>
</body>
</html>
